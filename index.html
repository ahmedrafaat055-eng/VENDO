<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDO</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{
    margin:0;
    background:radial-gradient(circle at top,#021428,#000);
    color:#fff;
}
header{
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#00bfff;
    text-shadow:0 0 15px #00bfff;
}
.privacy-bar{
    font-size:12px;
    padding:8px;
    background:#050505;
    color:#aaa;
    border-bottom:1px solid #00bfff;
}
.privacy-bar span{color:#00bfff;}
.welcome{
    margin:10px 0;
    font-size:14px;
    color:#fff;
    text-shadow:0 0 8px #00bfff;
    text-align:center;
}
section{display:none;padding:20px;}
.active{display:block;}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}
.card{
    border:2px solid #00bfff;
    border-radius:15px;
    padding:18px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,191,255,.3);
    transition:.3s;
    text-align:center;
    background:#000;
}
.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px #00bfff;
}
.card img{
    width:100%;
    border-radius:12px;
    margin-bottom:10px;
}
.price{
    margin-top:8px;
    font-size:18px;
    color:#0af;
}
.btn{
    margin-top:15px;
    padding:12px 30px;
    border-radius:40px;
    border:none;
    background:linear-gradient(90deg,#00bfff,#0077ff);
    color:#000;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 25px #00bfff;
}
.btn.red{background:linear-gradient(90deg,#ff0000,#aa0000);color:#fff;}
.btn.green{background:linear-gradient(90deg,#00ff88,#00aa55);}
.btn:hover{opacity:.9}
input{width:80%;padding:12px;border-radius:12px;border:2px solid #00bfff;background:#000;color:#0af;font-size:16px;text-align:center;}
.info{font-size:16px;line-height:1.6;}
#cartItems{text-align:left;margin-top:15px;}
#cartTotal{font-weight:bold;color:#0af;margin-top:10px;}
</style>
</head>
<body>

<div class="privacy-bar">🔒 <span>سياسة الخصوصية:</span> بياناتك آمنة ولا يتم حفظها خارج الطلب فقط.</div>
<div class="welcome">🔥 أهلاً بك في متجر VENDO – أسرع، مضمون، وآمن 🔥</div>
<header>🔥 VENDO 🔥</header>

<!-- صفحة المنتجات -->
<section id="s1" class="active">
<h2>👇 اختر منتجاتك</h2>
<div class="cards" id="productList">
  <!-- المنتجات هتتضاف بالـ JS -->
</div>
<button class="btn" onclick="goCart()">عرض السلة 🛒</button>
</section>

<!-- صفحة السلة -->
<section id="s2">
<h2>🛒 سلة مشترياتك</h2>
<div id="cartItems"></div>
<div id="cartTotal"></div>
<input id="playerId" placeholder="اكتب اسمك أو ID">
<br>
<button class="btn green" onclick="checkout()">الدفع 💳</button>
<button class="btn red" onclick="backProducts()">العودة للمنتجات 🔄</button>
</section>

<script>
const products = [
  {name:"هاتف سامسونج",price:5000,img:"https://via.placeholder.com/180?text=Samsung"},
  {name:"هاتف ايفون",price:10000,img:"https://via.placeholder.com/180?text=iPhone"},
  {name:"سماعات بلوتوث",price:500,img:"https://via.placeholder.com/180?text=Headphones"},
  {name:"شاحن سريع",price:200,img:"https://via.placeholder.com/180?text=Charger"},
  {name:"كفر حماية",price:100,img:"https://via.placeholder.com/180?text=Case"},
  {name:"هارد ديسك خارجي",price:800,img:"https://via.placeholder.com/180?text=HDD"},
  {name:"راوتر واي فاي",price:300,img:"https://via.placeholder.com/180?text=Router"},
  {name:"لوحة مفاتيح ميكانيكية",price:400,img:"https://via.placeholder.com/180?text=Keyboard"}
];

let cart = [];

const whatsappNumber = "201104275701";

function renderProducts(){
  const container = document.getElementById("productList");
  container.innerHTML="";
  products.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="${p.img}"><strong>${p.name}</strong><div class="price">${p.price} جنيه</div><button class="btn" onclick="addCart(${i})">أضف للسلة ➕</button>`;
    container.appendChild(div);
  });
}

function addCart(index){
  cart.push(products[index]);
  alert(`${products[index].name} تم إضافته للسلة`);
}

function goCart(){
  document.getElementById("s1").classList.remove("active");
  document.getElementById("s2").classList.add("active");
  renderCart();
}

function backProducts(){
  document.getElementById("s2").classList.remove("active");
  document.getElementById("s1").classList.add("active");
}

function renderCart(){
  const cartDiv = document.getElementById("cartItems");
  cartDiv.innerHTML="";
  let total=0;
  cart.forEach((item,i)=>{
    total+=item.price;
    cartDiv.innerHTML+=`<div>${item.name} - ${item.price} جنيه <button class="btn red" onclick="removeItem(${i})">❌</button></div>`;
  });
  document.getElementById("cartTotal").innerText=`الإجمالي: ${total} جنيه`;
}

function removeItem(index){
  cart.splice(index,1);
  renderCart();
}

function checkout(){
  const pid = document.getElementById("playerId").value;
  if(!pid){alert("اكتب اسمك أو ID");return;}
  if(cart.length==0){alert("السلة فارغة");return;}
  let msg = `✅ تم الطلب من VENDO\nالعميل: ${pid}\n\nالمنتجات:\n`;
  let total=0;
  cart.forEach(item=>{
    msg+=`${item.name} - ${item.price} جنيه\n`;
    total+=item.price;
  });
  msg+=`\nالإجمالي: ${total} جنيه`;
  window.location.href=`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;
}

renderProducts();
</script>

</body>
  </html>
